app:
  id: "7711994394445873188"
  name: "塔防战争"
  slogan: "把塔防战场放进你的空间，用双手布局防御，迎战一波波敌人。"
  description: |
    【PICO Space Program 参赛作品】

    《塔防战争》是一款将塔防布阵与混合现实空间交互结合的策略游戏。战场如同摆在眼前的微缩世界，你可以用双手调整地图，亲手抓取防御塔，在有限金币下构建防线，阻止一波波敌人抵达基地。

    【用双手摆好战场】
    开战前，双手在地形附近捏合，即可移动、水平旋转和缩放地图：放大查看局部塔位，调整角度观察路线，或缩小掌握全局。松手结束调整，开战后地图停止调整，让你专注布防与战斗。

    【伸手购买，触碰看信息】
    用食指触碰商店中的塔模型，可查看价格与属性；捏合抓起塔，将它移向道路旁的合法底座，绿色预览提示可放置位置，松手后自动吸附，成功放置才扣款并开始自动攻击。取消未购买的塔不扣款；已购买的塔移出合法塔位并松手，可移除并退款。金币不足时模型置灰，仍可触碰查看信息。

    【六种防御塔，搭配不同防线】
    金辉速射塔擅长近距离补刀，蓝晶远射塔提供长射程重击，熔火重炮塔清理密集敌群；霜晶寒流塔减速控场，雷链电弧塔连锁攻击邻近目标，蚀毒孢子塔施加持续毒伤。利用路线转角和多段道路覆盖，把减速、单体、范围与持续伤害组合起来，在出口补上最后一道防线。

    【击杀获利，逐步迎战六关】
    敌人沿固定道路按波次前进，击杀获得金币，可继续购买防御塔；漏过的敌人会损伤基地。清除全部波次且基地仍有生命即可获胜，基地生命归零则失败。六关战役从草甸初哨、林间转角、溪谷回环，推进到疾风折线、铁壁盘道与王城终战，逐步考验你应对快速、重装和混合敌群的能力。通关后依次解锁后续关卡，并保存进度。
